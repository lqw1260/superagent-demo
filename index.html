<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>寄件小站 · 演示仓</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">演示用站点</p>
      <h1 class="title">把每一次寄件，都变成可追踪的承诺</h1>
      <p class="lede">这是一个只有几十行的静态页，用来演示一次完整的「请求 → 改动 → 验证 → 交付」。</p>
    </header>

    <section class="cards">
      <article class="card">
        <h2>下单</h2>
        <p>三十秒填完地址，自动比价。</p>
      </article>
      <article class="card">
        <h2>在途</h2>
        <p>每个节点都有时间戳与责任人。</p>
      </article>
      <article class="card">
        <h2>签收</h2>
        <p>异常件自动生成待办，不用人肉捞。</p>
      </article>
    </section>

    <footer class="foot">演示仓 · 改动请保持最小</footer>
  </main>
</body>
</html>
